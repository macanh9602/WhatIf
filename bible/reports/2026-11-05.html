<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo What If</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root { --bg:#f4f6fb; --card:#ffffff; --ink:#1d1a3a; --muted:#5b6078; --line:#e2e6f0; --accent:#2f6df6; --accent-soft:#e6eeff;
  --good:#12a150; --warn:#d97706; --zebra:#f8f9fd; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1220; --card:#181c2e; --ink:#e9ebf5; --muted:#9aa1bd;
  --line:#2a3048; --accent:#7aa2ff; --accent-soft:#1f2a4d; --good:#3ddc84; --warn:#fbbf24; --zebra:#1c2136; } }
:root[data-theme="dark"] { --bg:#0f1220; --card:#181c2e; --ink:#e9ebf5; --muted:#9aa1bd; --line:#2a3048; --accent:#7aa2ff;
  --accent-soft:#1f2a4d; --good:#3ddc84; --warn:#fbbf24; --zebra:#1c2136; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif; }
header { background:linear-gradient(135deg,#1d1a3a,#2f3f8f); color:#fff; padding:28px 16px 22px; }
header .wrap { max-width:860px; margin:0 auto; }
header .kicker { font-size:13px; letter-spacing:.12em; text-transform:uppercase; opacity:.75; }
header h1 { margin:4px 0 0; font-size:clamp(22px,5vw,30px); font-weight:800; line-height:1.25; }
main { max-width:860px; margin:0 auto; padding:16px; }
#doc > h1 { display:none; }
#doc > h2 { margin:22px 0 10px; font-size:19px; font-weight:800; display:flex; align-items:center; gap:10px; }
#doc > h2::before { content:""; width:6px; height:22px; border-radius:3px; background:var(--accent); }
section.card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:6px 18px 12px; margin-bottom:14px;
  box-shadow:0 1px 2px rgba(20,24,60,.05); }
h3 { font-size:16px; margin:16px 0 4px; }
p, li { color:var(--ink); }
ul, ol { padding-left:22px; }
li { margin:4px 0; }
strong { font-weight:800; }
em { color:var(--muted); }
code { background:var(--accent-soft); padding:1px 6px; border-radius:6px; font-size:.88em; }
.table { overflow-x:auto; margin:8px -4px; }
table { border-collapse:collapse; width:100%; font-size:14.5px; min-width:520px; }
th, td { padding:8px 10px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
th { font-size:12.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); }
tr:nth-child(even) td { background:var(--zebra); }
td:first-child { white-space:normal; min-width:9em; }
blockquote { margin:10px 0; padding:8px 14px; border-left:4px solid var(--accent); background:var(--accent-soft); border-radius:0 10px 10px 0; }
li:has(> input[type=checkbox]) { list-style:none; margin-left:-22px; }
input[type=checkbox] { width:17px; height:17px; vertical-align:-3px; margin-right:8px; accent-color:var(--accent); }
hr { border:0; border-top:1px dashed var(--line); margin:16px 0; }
footer { max-width:860px; margin:0 auto; padding:4px 16px 32px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<header><div class="wrap"><div class="kicker">What If · báo cáo tối</div><h1 id="title">2026-11-05</h1></div></header>
<main id="doc"></main>
<footer>Tạo tự động từ ops/report.mjs · số liệu YouTube Data + Analytics API</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const MD = "# Báo cáo tối 2026-11-05, kênh What If\n\n## 1. Thực trạng\n\nHiện vẫn chỉ có **một bản chụp, lúc 01:37 UTC** (08:37 giờ VN), khoảng 1,6 giờ sau khi cả 5 tập lên sóng. Bản này ghi đè bản 01:27 của báo cáo trước, nên phần so sánh bên dưới chỉ là chênh lệch trong 10 phút, chưa phải chênh lệch theo ngày.\n\n| Tập | Dài | Views | Δ | % xem | Giây TB | Likes | Subs | Nguồn chính |\n|---|---|---|---|---|---|---|---|---|\n| ep05 Nghiến răng | 1:15 | **408** | +50 | n/a | n/a | 8 (+2) | n/a | n/a |\n| ep02 Chỉnh cân nặng | 1:23 | **272** | +16 | n/a | n/a | 4 (0) | n/a | n/a |\n| ep01 Không có màu xanh | 1:29 | 0 | 0 | n/a | n/a | 0 | n/a | n/a |\n| ep03 Lên cấp mất năm | 1:29 | 0 | 0 | n/a | n/a | 0 | n/a | n/a |\n| ep04 Mặt sau gáy | 1:14 | 0 | 0 | n/a | n/a | 0 | n/a | n/a |\n\n- **Feed đang đẩy ep05**: tăng 50 view trong 10 phút, gấp 3 lần ep02. Tỉ lệ like của ep05 là 1,96 %, của ep02 là 1,47 %.\n- **ep02 vẫn lên nhưng chậm lại.**\n- **ep01, ep03, ep04 vẫn đứng ở 0.** Cả ba đều public nên số 0 tròn là bất thường. Có thể feed chỉ thử 2 trong 5 tập ra cùng lúc, nhưng chưa có dữ liệu để khẳng định.\n- `analytics`, `retention`, `traffic` vẫn trống.\n\n## 2. Chẩn đoán\n\n- **Chưa biết người xem bỏ ở câu nào** vì chưa có retention, nên chưa áp được công thức ratio × thời lượng × số từ. Không đoán.\n- **Hook của 2 tập có view:**\n  - ep05: \"…the loudest grinder you'd hear is you.\" Tiếp ngay sau là một hành động người xem làm được: \"Three, two, one, grind.\"\n  - ep02: \"…below eighty grams you'd float away like a balloon.\" Có một con số và một hình ảnh cụ thể ngay câu đầu.\n- **Hook của 3 tập 0 view** nói về hệ quả cho thế giới hoặc tình huống (\"every forest\", \"teenagers would become the richest\", \"nobody could sneak up\"), không nói về thứ người xem cảm thấy ngay. Đây vẫn chỉ là giả thuyết, vì ep04 cũng là chủ đề cơ thể.\n- **Độ dài không giải thích được chênh lệch:** ep04 dài 1:14 vẫn 0 view, ep02 dài 1:23 vẫn có view.\n- **Mẫu rất mỏng:** 2 tập có view so với 3 tập không, trong một khung 1,6 giờ. Việc ra cả 5 tập cùng lúc làm nhiễu mọi so sánh.\n\n## 3. Feedback cho tập sau\n\n1. **Hook là cảm giác của chính người xem**, kèm một con số hoặc một âm thanh, như ep02 và ep05.\n2. **Trong 5 giây đầu có một việc người xem làm thử được**, như câu đếm ngược của ep05.\n3. **2 giây đầu là cận cảnh \"you\" đang làm đúng việc đó.** Không mở bằng cảnh rộng, cảnh địa cầu hay cảnh rừng.\n4. **Câu chốt là một câu hỏi bắt người xem tự kiểm** (\"did you just…?\"), giống ep05.\n5. **Giữ độ dài khoảng 1:15.** Chưa có dữ liệu nào để đổi.\n\n## 4. Đề xuất tập tiếp theo\n\nCác số dưới đây là kiến thức phổ biến, **chưa kiểm**. Cần tính và ghi nguồn trong `SCRIPT.md` trước khi viết.\n\n**A. What If You Stopped Blinking? 👁️ ⭐ Đề xuất**\n- Hook (12 từ): *\"If you stopped blinking, your eyes would start burning before this video ends.\"*\n- Chuỗi: chớp khoảng 15-20 lần/phút → màng nước mắt vỡ sau vài giây → giác mạc không có mạch máu, lấy oxy từ không khí qua nước mắt → khô rát, mờ → \"Did you just blink?\"\n- Lý do: người xem tự thử nhịn chớp suốt video, nên vừa đúng mẫu của ep05 vừa có lợi cho giữ chân. 2 giây đầu dễ dựng bằng cận cảnh mắt mở trừng.\n\n**B. What If Your Nose Only Had One Hole? 👃**\n- Hook (11 từ): *\"Cover one nostril and breathe. One side is already slacking off.\"*\n- Chuỗi: chu kỳ mũi, hai bên luân phiên sưng và thông sau vài giờ (cần kiểm số giờ) → một bên nghỉ, một bên làm → câu chốt \"you already breathe with one\".\n- Lý do: thử được ngay và có nhịp \"nature already does this\".\n\n**C. What If Everyone Could Hear Your Heartbeat? 💓**\n- Hook (10 từ): *\"If everyone could hear your heartbeat, lying would become impossible.\"*\n- Chuỗi: nhịp nghỉ khoảng 60-100 lần/phút → tăng khi sợ, khi crush → buổi hẹn bị lộ → máy phát hiện nói dối vốn đã đo nhịp tim.\n- Lý do: có âm thanh như ep05. Điểm yếu: không có việc gì để người xem thử ngay.\n\n## 5. Việc cần làm tối nay\n\n- [ ] Mở YouTube Studio xem ep01, ep03, ep04: đã xử lý xong chưa, có bị giới hạn hay \"made for kids\" không.\n- [ ] Đảm bảo chỉ có **một tập** đặt lịch lúc 2026-11-06 00:00Z (07:00 VN).\n- [ ] Chốt ep06 (đề xuất A), viết `SCRIPT.md`, kiểm từng số.\n- [ ] **Sửa ops:** bản chụp mới nhất là 08:37 VN, nhưng báo cáo chạy lúc 21:00. Cần chụp lại ngay trước khi viết báo cáo và lưu theo giờ, đừng ghi đè theo ngày.\n- [ ] `analytics` đang null: kiểm token có scope YouTube Analytics không, hay số liệu chỉ đang trễ 1-2 ngày.\n\n---\nKhông có câu thoại nào được đối chiếu với điểm người xem bỏ đi, vì chưa có retention. Mọi số trong báo cáo đều lấy từ bản chụp 01:37Z hoặc báo cáo trước.\n";
const doc = document.getElementById("doc");
try { doc.innerHTML = marked.parse(MD, { gfm: true }); }
catch { doc.textContent = MD; doc.style.whiteSpace = "pre-wrap"; } // offline: still readable
const h1 = doc.querySelector("h1"); if (h1) document.getElementById("title").textContent = h1.textContent;
// wrap each h2 + its content in a card; tables scroll sideways on phones
[...doc.querySelectorAll("table")].forEach((t) => { const w = document.createElement("div"); w.className = "table"; t.replaceWith(w); w.append(t); });
let card = null;
[...doc.childNodes].forEach((n) => {
  if (n.nodeName === "H2") { card = document.createElement("section"); card.className = "card"; n.after(card); return; }
  if (card && n.nodeName !== "H1") card.append(n);
});
doc.querySelectorAll("input[type=checkbox]").forEach((c) => (c.disabled = false));
</script>
</body>
</html>
